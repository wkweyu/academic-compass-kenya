name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 days at 08:00 UTC — keeps the free-tier project from auto-pausing
    - cron: "0 8 */3 * *"
  workflow_dispatch: # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://basvqricgupbxgznsfms.supabase.co/rest/v1/")
          echo "Supabase ping status: $STATUS"
          if [ "$STATUS" -ge 500 ]; then
            echo "::warning::Supabase returned $STATUS — project may be paused"
            exit 1
          fi
